spring.application.name=analytics-consumer
server.port=9090

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093
spring.kafka.consumer.group-id=analytics-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Streams Configuration
spring.kafka.streams.application-id=analytics-streams-app
spring.kafka.streams.bootstrap-servers=localhost:9092,localhost:9093
spring.kafka.streams.default-key-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.default-value-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.processing-guarantee=exactly_once_v2
spring.kafka.streams.state-dir=/tmp/kafka-streams

# Logging
logging.level.com.hunglp.consumer=INFO
logging.level.org.apache.kafka.streams=WARN
logging.level.org.springframework.kafka=WARN
